# Mosquitto para IVESS Conecta
# ─────────────────────────────────────────────────────────────
# DESARROLLO (tu PC): alcanza con esto
listener 1883 127.0.0.1
allow_anonymous true
persistence true
persistence_location ./data/

# ─────────────────────────────────────────────────────────────
# PRODUCCIÓN (servidor): comentá el bloque de arriba y usá este.
# Puerto 8883 con TLS, usuario por gateway y ACL por topic.
#
# listener 8883
# certfile /etc/letsencrypt/live/mqtt.tudominio.com.ar/fullchain.pem
# keyfile  /etc/letsencrypt/live/mqtt.tudominio.com.ar/privkey.pem
# allow_anonymous false
# password_file /etc/mosquitto/passwd
# acl_file /etc/mosquitto/acl
# persistence true
# persistence_location /var/lib/mosquitto/
# # Guarda mensajes QoS 1 del ingestor si se reinicia (sesión persistente)
# max_queued_messages 100000
#
# Alta de usuarios:
#   mosquitto_passwd -c /etc/mosquitto/passwd ivess-ingestor
#   mosquitto_passwd    /etc/mosquitto/passwd EM300-0001
